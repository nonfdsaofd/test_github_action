name: Build Windows (Win7) & Linux Executables

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Compile Linux and Windows (Win7 compatible) binaries
        run: |
          mkdir -p build

          # Linux x86_64 executable
          gcc -O2 -Wall -o build/hello-linux main.c

          # Windows 64-bit (.exe) - static linking + MSVCRT + Win7 target (0x0601)
          x86_64-w64-mingw32-gcc -O2 -Wall -D_WIN32_WINNT=0x0601 -static -o build/hello-win64.exe main.c

          # Windows 32-bit (.exe) - for 32-bit Windows 7
          i686-w64-mingw32-gcc -O2 -Wall -D_WIN32_WINNT=0x0601 -static -o build/hello-win32.exe main.c

          ls -lh build/

      - name: Upload compiled executables
        uses: actions/upload-artifact@v7
        with:
          name: hello-world-binaries
          path: build/
